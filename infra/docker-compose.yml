version: "3.8"

services:

  jenkins:
    image: new_jenkins_v1
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - /var/jenkins_home:/var/jenkins_home
      - /models:/models
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - /models:/models
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
